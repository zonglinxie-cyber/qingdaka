<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="t d">
  <title id="t">靠墙俯卧撑第一步：面对墙站好，手臂撑直</title>
  <desc id="d">原创简化侧视静态示意，不是真人示范或专业动作认证。左侧一道竖直墙面，人物侧身面对墙站，双脚一前一后踩在垫面上，双手手掌按在墙上、手臂几乎撑直；头顶、肩、髋、膝到脚踝像一块斜靠的板，没有塌腰也没有拱臀。脚离墙越远，动作越难。</desc>
