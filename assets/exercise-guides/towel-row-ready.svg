<svg xmlns="http://www.w3.org/2000/svg" width="460" height="460" viewBox="0 0 460 460" role="img" aria-labelledby="t d">
  <title id="t">坐姿毛巾划船第一步：坐稳，毛巾绕过脚底，两手各抓一头</title>
  <desc id="d">原创简化侧视静态示意，不是真人示范或专业动作认证。人物侧向左坐在稳固椅子上，臀部坐在椅面上，上身直立不后仰；大腿接近水平向前伸出，膝弯约直角，两只脚掌平踩在地面上；一条毛巾从近侧脚的脚前掌底下绕过，沿小腿前方斜向上拉到双手，两臂向前下方伸出、手在膝前抓住毛巾两头。</desc>
