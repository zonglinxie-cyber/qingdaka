<svg xmlns="http://www.w3.org/2000/svg" width="460" height="460" viewBox="0 0 460 460" role="img" aria-labelledby="t d">
  <title id="t">扶墙股四头拉伸第二步：抓住脚背，把脚跟抬向臀部</title>
  <desc id="d">原创简化侧视静态示意，不是真人示范或专业动作认证。与第一格同一个人、同一面墙、同一只按墙的手、同一条直立承重的腿，上身仍然直立、没有前倾。只有两件事变了——靠镜头这条腿的膝盖朝下，小腿向后向上折起，脚背抬到臀部后下方；伸到身后的那只手已经抓住脚背，手在脚踝前上方。鞋后上方一支指向臀部的箭头表示继续把脚跟往臀部收。两只膝盖画在同一高度、几乎重叠，因为要领要的就是双膝并拢、不外展；正侧视无法表现「不外展」这个左右方向，那一句由口令与文字步骤承担。</desc>
