<svg xmlns="http://www.w3.org/2000/svg" width="520" height="460" viewBox="0 0 520 460" role="img" aria-labelledby="t d">
  <title id="t">臀桥第一步：仰卧屈膝，双脚踩稳</title>
  <desc id="d">原创简化侧视静态示意，不是真人示范或专业动作认证。人物仰卧在垫面上，头顶朝左、后脑贴在垫上，双臂自然放在身体两侧（侧视里被躯干挡住）；双膝弯曲，两只脚掌平放在垫面上，臀部仍贴在垫面，尚未抬起。</desc>
