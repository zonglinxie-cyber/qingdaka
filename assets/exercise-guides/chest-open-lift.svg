<svg xmlns="http://www.w3.org/2000/svg" width="460" height="460" viewBox="0 0 460 460" role="img" aria-labelledby="t d">
  <title id="t">胸前侧拉伸第二步：把交握的双手向后向下伸开，同时挺胸、肩向后向下沉</title>
  <desc id="d">原创简化侧视静态示意，不是真人示范或专业动作认证。与第一格同一个站姿、同一条竖直上身、同一双脚位，只有两条手臂变了：肘部伸直一些，那双在身后交握的手往身后下方伸得更远，离臀部明显比第一格远，箭头指向后下方。挺胸和沉肩是这一步的两半：胸向上展开、肩向后向下沉，头保持中立，没有前伸也没有后仰。箭头说的是手要往哪里去，不是让人把腰向后拱。正侧视看不出两侧肩是否对称、也看不出肋骨外翻的限度，那两句由口令与文字步骤承担。</desc>
