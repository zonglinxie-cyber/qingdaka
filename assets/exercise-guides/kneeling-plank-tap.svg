<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460" role="img" aria-labelledby="t d">
  <title id="t">跪姿平板第二步：撑稳后抬起一只手点对侧肩</title>
  <desc id="d">原创简化侧视静态示意，不是真人示范或专业动作认证。人物面朝左，姿势与第一格相同：双膝与小腿平放在垫面上，另一只前臂仍撑在垫面；抬起靠近观者这一侧的手，肘部朝上，手掌落到对侧肩上；头、肩、髋、膝仍保持同一条斜直线，身体不跟着转。</desc>
