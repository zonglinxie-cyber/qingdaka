    <text x="30" y="57" text-anchor="middle" font-size="20" font-weight="600">2</text>
    <text x="59" y="58" font-size="24" font-weight="600">肘贴身，拉向腰侧</text>
  </g>

  <g transform="translate(66 -110) scale(1.2)" stroke-linecap="round" stroke-linejoin="round">
