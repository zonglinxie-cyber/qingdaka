      <path d="M143 311L136 411M230 302L237 411M140 365H233" fill="none" stroke="#aebdb2" stroke-width="9"/>
      <path d="M232 225V306" fill="none" stroke="#aebdb2" stroke-width="10"/>
      <rect x="224" y="209" width="15" height="88" rx="5" fill="#e2e9e3" stroke="#aebdb2" stroke-width="3"/>
      <rect x="128" y="303" width="111" height="12" rx="4" fill="#e2e9e3" stroke="#aebdb2" stroke-width="3"/>
    </g>
    <path id="profile-head" d="M1-21C-10-22-20-14-20-4L-25 3Q-27 7-20 8L-19 15Q-17 23-7 23H3C15 21 21 9 20-4C19-15 11-21 1-21Z" fill="#3e5147"/>
    <path id="flat-shoe" d="M-8-3H8L11 10Q12 17 6 17H-26Q-30 17-30 13V11Q-29 7-21 5L-9 1Z"/>
    <path id="torso" d="M-9.6-76.6Q0-82.7 10.4-75.7Q15.7-70.5 15.7-58.3L14.8-29.6L15.7-5.2Q4.4 2.6-13.9-2.6L-14.8-30.5L-15.7-58.3Q-16.5-70.5-9.6-76.6Z" fill="#c0d0c2" stroke="#526b59" stroke-width="3"/>
  </defs>

  <rect width="460" height="460" fill="#ffffff"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#354a3e">
