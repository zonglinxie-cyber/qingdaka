<svg xmlns="http://www.w3.org/2000/svg" width="460" height="460" viewBox="0 0 460 460" role="img" aria-labelledby="t d">
  <title id="t">坐姿毛巾划船第二步：肘沿身体向后收，把毛巾拉向腰侧</title>
  <desc id="d">原创简化侧视静态示意，不是真人示范或专业动作认证。与第一格同一把椅子、同一个坐姿：臀部、大腿、两只脚掌的位置都没有动，毛巾仍从近侧脚的脚前掌底下绕过；只有双臂变了——肘沿身体向后收，两只手一上一下收到腰侧前，肘弯贴在身体侧面，手前上方指向身体的箭头表示往身体方向拉。上身仍然直立，没有后仰，肩没有耸起。</desc>
