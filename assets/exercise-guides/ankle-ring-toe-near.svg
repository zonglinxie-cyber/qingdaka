<svg xmlns="http://www.w3.org/2000/svg" width="460" height="460" viewBox="0 0 460 460" role="img" aria-labelledby="t d">
  <title id="t">踝关节绕环第一步：一只脚踩稳，另一只脚向前伸出、脚尖点在地上的圈上</title>
  <desc id="d">原创简化示意，俯视偏侧的近景（只画到腰以下，为了把地上那一圈看清），不是真人示范或专业动作认证。画面右侧那条腿直立、整只脚掌踩稳，体重在它身上；左侧这条腿从髋向前伸出、膝微弯，脚跟抬起，只有脚尖落在那圈虚线上。虚线圈画在脚尖所在的地面上，圈两端各有一个方向相反的箭头，表示这一圈要顺着绕几圈、再逆着绕几圈。这一格脚尖停在圈靠前的一侧。下一格同一只脚的脚尖沿圈转到另一侧、脚跟跟着向外摆。近景是刻意裁掉的：全身侧视会把水平的圈压成一条缝，看不出绕环；上身是否直立、能扶墙这两点由口令承担。</desc>
  <defs>
    <path id="shoe-flat" d="M-8-3H8L11 10Q12 17 6 17H-26Q-30 17-30 13V11Q-29 7-21 5L-9 1Z"/>
  </defs>

  <rect width="460" height="460" fill="#ffffff"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#354a3e">
    <circle cx="30" cy="50" r="17" fill="#eef3ee"/>
    <text x="30" y="57" text-anchor="middle" font-size="20" font-weight="600">1</text>
    <text x="59" y="58" font-size="24" font-weight="600">一只脚踩稳，脚尖点在圈上</text>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 地面：只留一条很淡的横线定住「踩稳」这件事 -->
    <path d="M40 372H420" fill="none" stroke="#e1e7e2" stroke-width="2"/>

    <!-- 脚尖要划过的那一圈：椭圆给足透视高度，两端各一个反向箭头＝顺逆各几次 -->
    <ellipse cx="168" cy="344" rx="86" ry="36" fill="none" stroke="#93a898" stroke-width="4" stroke-dasharray="11 10"/>
    <path d="M86 322L96 340L74 338Z" fill="#7f977f"/>
    <path d="M250 366L240 348L262 350Z" fill="#7f977f"/>

    <!-- 承重腿（远侧）：直立、整只脚踩地 -->
    <path d="M300 150L296 250L292 350" fill="none" stroke="#586f60" stroke-width="46"/>
    <path d="M300 150L296 250L292 350" fill="none" stroke="#8fa597" stroke-width="36"/>
    <use href="#shoe-flat" transform="translate(292 352) scale(1.55)" fill="#57695e"/>

    <!-- 躯干下段与骨盆：把两条腿的上端压在下面，接缝不外露 -->

    <!-- 工作腿（近侧）：向前伸、膝微弯、脚跟抬起，只有脚尖落在圈上 -->
    <path d="M268 176L232 252L196 306" fill="none" stroke="#ffffff" stroke-width="52"/>
    <path d="M268 176L232 252L196 306" fill="none" stroke="#465e4f" stroke-width="44"/>
    <path d="M268 176L232 252L196 306" fill="none" stroke="#a3b6a7" stroke-width="34"/>
    <path d="M196 300Q214 306 216 322Q217 336 202 344L176 356Q166 360 164 352Q163 344 174 338L188 322Q182 310 188 302Z" fill="#ffffff" stroke="none"/>
    <path d="M196 300Q214 306 216 322Q217 336 202 344L176 356Q166 360 164 352Q163 344 174 338L188 322Q182 310 188 302Z" fill="#354b3e" stroke="#2c3f34" stroke-width="3"/>
    <circle cx="166" cy="352" r="7" fill="#2c3f34"/>

    <!-- 平口裁切的上身＋短裤：画在两条腿之上，压住近侧腿白边的收口 -->
    <path d="M268 92H326L336 146L332 174Q312 186 290 184Q268 182 258 172L254 146Z" fill="#c0d0c2" stroke="#526b59" stroke-width="4"/>
    <path d="M255 146H336L333 174Q312 188 290 186Q268 184 257 172Z" fill="#5d7464" stroke="#46594d" stroke-width="3"/>
    <path d="M255 146H336" fill="none" stroke="#46594d" stroke-width="3"/>
  </g>
</svg>
