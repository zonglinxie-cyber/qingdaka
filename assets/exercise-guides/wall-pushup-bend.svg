    <text x="30" y="57" text-anchor="middle" font-size="20" font-weight="600">2</text>
    <text x="59" y="58" font-size="24" font-weight="600">屈肘近墙，身成一线</text>
  </g>

  <g transform="translate(0 -224) scale(2)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="27" y="152" width="16" height="228" rx="4" fill="#eef3ee" stroke="#dde5de" stroke-width="2"/>
    <rect x="27" y="380" width="188" height="20" rx="10" fill="#eef3ee" stroke="#dde5de" stroke-width="2"/>

