<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="t d">
  <title id="t">靠墙俯卧撑第二步：屈肘让胸口靠近墙，身体仍是一条直线</title>
  <desc id="d">原创简化侧视静态示意，不是真人示范或专业动作认证。双脚和手掌都不动，只有手肘向下方弯下去；肩、髋、膝、踝跟着整块身体一起向墙倾斜，虚线标出头顶到脚踝仍是同一条直线，没有塌腰也没有拱臀。胸口贴近墙时停住，再撑回第一步。</desc>
