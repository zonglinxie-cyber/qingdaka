    <path id="torso" d="M-9.6-76.6Q0-82.7 10.4-75.7Q15.7-70.5 15.7-58.3L14.8-29.6L15.7-5.2Q4.4 2.6-13.9-2.6L-14.8-30.5L-15.7-58.3Q-16.5-70.5-9.6-76.6Z" fill="#c0d0c2" stroke="#526b59" stroke-width="3"/>
  </defs>

  <rect width="480" height="640" fill="#ffffff"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#354a3e">
