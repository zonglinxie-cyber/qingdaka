<svg xmlns="http://www.w3.org/2000/svg" width="520" height="460" viewBox="0 0 520 460" role="img" aria-labelledby="t d">
  <title id="t">臀桥第二步：脚跟推地抬髋，肩膝接近一条线</title>
  <desc id="d">原创简化侧视静态示意，不是真人示范或专业动作认证。人物仍仰卧在垫面上，两只脚掌位置不变、小腿接近垂直；髋部向上抬起，虚线标出肩、髋、膝落在同一条斜直线上，腰没有向上拱起。双臂自然放在身体两侧，侧视里被躯干挡住。</desc>
  <defs>
