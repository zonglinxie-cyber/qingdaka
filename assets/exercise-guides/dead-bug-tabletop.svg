  <title id="t">死虫第一步：仰卧抬起手脚，髋与膝各约 90°</title>
  <desc id="d">原创简化侧视静态示意，不是真人示范或专业动作认证。人物仰卧在垫面上，头枕在垫子上、脸朝向天花板；手臂向上伸向天花板（正侧视里两条手臂重合，只画一条），大腿垂直、小腿与垫面平行，髋与膝各约 90°，两只脚一远一近错开，腰背贴在垫面上。</desc>
