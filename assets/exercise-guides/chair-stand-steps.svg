<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520" role="img" aria-labelledby="guide-title guide-desc">
  <title id="guide-title">扶椅坐站：空手练习静态分步示意</title>
  <desc id="guide-desc">原创简化侧视静态示意，不是真人示范或专业动作认证。两格人物与椅子使用一致尺度。第一格：髋膝弯曲，臀部轻触椅面前缘，脚掌着地，上身略前倾，手扶大腿。第二格：双脚踩稳后直立，不过度挺腰，两手空手自然垂下，椅子留在身后。椅背紧邻墙面。</desc>
