<svg xmlns="http://www.w3.org/2000/svg" width="520" height="460" viewBox="0 0 520 460" role="img" aria-labelledby="t d">
  <title id="t">死虫第二步：对侧手脚慢慢伸出，腰背贴稳垫面</title>
  <desc id="d">原创简化侧视静态示意，不是真人示范或专业动作认证。人物仰卧在垫面上、头枕在垫子上，画面从右侧看：近侧的右手越过头顶向后伸，远侧的左腿向前下方伸出——一近一远，正是相反的一侧；远侧的左手仍向上伸着，近侧的右腿保持第一步的抬起位置不动。伸出去的手脚都没有碰到垫面：伸多远由腰背能否稳住决定，不必碰到地面。腹部上方的向下箭头表示腰背全程压在垫面上，不跟着拱起来。</desc>
  <defs>
    <path id="shoe" d="M-8-3H8L11 10Q12 17 6 17H-26Q-30 17-30 13V11Q-29 7-21 5L-9 1Z"/>
  </defs>

  <rect width="520" height="460" fill="#ffffff"/>
