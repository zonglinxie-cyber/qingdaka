<svg xmlns="http://www.w3.org/2000/svg" width="460" height="460" viewBox="0 0 460 460" role="img" aria-labelledby="t d">
  <title id="t">踝关节绕环第二步：同一只脚的脚尖沿圈转到靠后的一侧，脚跟向外摆</title>
  <desc id="d">原创简化示意，俯视偏侧的近景（只画到腰以下，为了把地上那一圈看清），不是真人示范或专业动作认证。承重的那条腿与第一格完全相同：直立、整只脚掌踩稳。变的只有前伸那条腿的脚踝——脚尖已经沿着地上那圈虚线转到靠后的一侧，脚跟因此抬得更高并向外摆，脚背的朝向明显比第一格更扭。两格轮流出现看到的就是脚尖在圈上换位；真实的连续绕环与顺、逆各几次由圈两端那两个反向箭头、口令和文字步骤承担。上身是否直立、能扶墙这两点由口令承担。</desc>
  <defs>
    <path id="shoe-flat" d="M-8-3H8L11 10Q12 17 6 17H-26Q-30 17-30 13V11Q-29 7-21 5L-9 1Z"/>
  </defs>

  <rect width="460" height="460" fill="#ffffff"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#354a3e">
    <circle cx="30" cy="50" r="17" fill="#eef3ee"/>
    <text x="30" y="57" text-anchor="middle" font-size="20" font-weight="600">2</text>
    <text x="59" y="58" font-size="24" font-weight="600">脚尖沿圈转到靠后一侧</text>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 372H420" fill="none" stroke="#e1e7e2" stroke-width="2"/>

    <ellipse cx="168" cy="344" rx="86" ry="36" fill="none" stroke="#93a898" stroke-width="4" stroke-dasharray="11 10"/>
    <path d="M86 322L96 340L74 338Z" fill="#7f977f"/>
    <path d="M250 366L240 348L262 350Z" fill="#7f977f"/>

    <path d="M300 150L296 250L292 350" fill="none" stroke="#586f60" stroke-width="46"/>
    <path d="M300 150L296 250L292 350" fill="none" stroke="#8fa597" stroke-width="36"/>
    <use href="#shoe-flat" transform="translate(292 352) scale(1.55)" fill="#57695e"/>


    <path d="M268 176L222 244L172 282" fill="none" stroke="#ffffff" stroke-width="52"/>
    <path d="M268 176L222 244L172 282" fill="none" stroke="#465e4f" stroke-width="44"/>
    <path d="M268 176L222 244L172 282" fill="none" stroke="#a3b6a7" stroke-width="34"/>
    <path d="M176 276Q190 288 182 302Q174 314 156 316L144 314Q134 310 138 300Q142 292 154 290L164 282Q166 272 176 276Z" fill="#ffffff" stroke="none"/>
    <path d="M176 276Q190 288 182 302Q174 314 156 316L144 314Q134 310 138 300Q142 292 154 290L164 282Q166 272 176 276Z" fill="#354b3e" stroke="#2c3f34" stroke-width="3"/>
    <circle cx="150" cy="311" r="7" fill="#2c3f34"/>

    <!-- 平口裁切的上身＋短裤：画在两条腿之上，压住近侧腿白边的收口 -->
    <path d="M268 92H326L336 146L332 174Q312 186 290 184Q268 182 258 172L254 146Z" fill="#c0d0c2" stroke="#526b59" stroke-width="4"/>
    <path d="M255 146H336L333 174Q312 188 290 186Q268 184 257 172Z" fill="#5d7464" stroke="#46594d" stroke-width="3"/>
    <path d="M255 146H336" fill="none" stroke="#46594d" stroke-width="3"/>
  </g>
</svg>
