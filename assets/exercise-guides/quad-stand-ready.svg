<svg xmlns="http://www.w3.org/2000/svg" width="460" height="460" viewBox="0 0 460 460" role="img" aria-labelledby="t d">
  <title id="t">扶墙股四头拉伸第一步：扶墙站稳，屈膝把脚跟抬到身后，另一手向后伸过去</title>
  <desc id="d">原创简化侧视静态示意，不是真人示范或专业动作认证。人朝左站立，画面左侧一整条墙面（从画布边缘延伸进来）；靠墙的那条手臂向前伸出、手掌按在墙面上，肘部有一点点弯。远侧那条腿直立踩在地面上承重，上身直立，肩与髋在同一条竖直线上，没有前倾也没有后仰。靠镜头这条腿已经屈膝，膝盖朝下、小腿向后向上折起，脚离开了地面，鞋停在臀部后下方、比第二格低一些的位置。另一条手臂从身侧向下向后伸，手伸到脚踝前上方、还没有抓到的位置，手前下方一支指向脚跟的箭头表示手要往那里去。抓稳后把脚跟继续抬向臀部是第二格。正侧视看不出双膝是否并拢，那一句由口令与文字步骤承担。</desc>
