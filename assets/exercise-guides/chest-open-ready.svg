<svg xmlns="http://www.w3.org/2000/svg" width="460" height="460" viewBox="0 0 460 460" role="img" aria-labelledby="t d">
  <title id="t">胸前侧拉伸第一步：站直，双手在身后交握，手臂垂到臀部后方</title>
  <desc id="d">原创简化侧视静态示意，不是真人示范或专业动作认证。人朝左站立，两脚踩在同一条地面线上（侧视里前后错开一点只为看清是两条腿，实际是并拢与髋同宽），上身直立，肩与髋在同一条竖直线上。两条手臂都从肩向后向下伸，肘部有一点点弯，两手在臀部后方、明显离开身体的位置交握：朝镜头这只手画成深色并带一圈白边，压在另一只手上，表示两手握住。这一格还没有向后用力。下一格把这双交握的手向后向下伸得更远，同时挺胸、肩向后向下沉。正侧视看不出两侧肩是否对称、也看不出肋骨外翻的限度，那两句由口令与文字步骤承担。</desc>
  <defs>
    <path id="profile-head" d="M1-21C-10-22-20-14-20-4L-25 3Q-27 7-20 8L-19 15Q-17 23-7 23H3C15 21 21 9 20-4C19-15 11-21 1-21Z" fill="#3e5147"/>
    <path id="flat-shoe" d="M-8-3H8L11 10Q12 17 6 17H-26Q-30 17-30 13V11Q-29 7-21 5L-9 1Z"/>
