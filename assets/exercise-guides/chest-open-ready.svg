    <text x="30" y="57" text-anchor="middle" font-size="20" font-weight="600">1</text>
    <text x="59" y="58" font-size="24" font-weight="600">双手在身后交握</text>
  </g>

  <g transform="translate(-55 -170) scale(1.46)" stroke-linecap="round" stroke-linejoin="round">
