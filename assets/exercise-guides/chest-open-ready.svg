    <circle cx="219" cy="303" r="8" fill="#57695e"/>

    <path d="M200 300L202 352L206 398" fill="none" stroke="#586f60" stroke-width="26"/>
    <path d="M200 300L202 352L206 398" fill="none" stroke="#8fa597" stroke-width="20"/>
    <use href="#flat-shoe" transform="translate(206 398)" fill="#57695e"/>

    <path d="M188 298L186 354L184 402" fill="none" stroke="#465e4f" stroke-width="30"/>
    <path d="M188 298L186 354L184 402" fill="none" stroke="#a3b6a7" stroke-width="24"/>
    <use href="#flat-shoe" transform="translate(184 402)" fill="#354b3e"/>

    <g transform="translate(194 300) rotate(-2)"><use href="#torso"/></g>
    <path d="M188 224L186 204" fill="none" stroke="#3e5147" stroke-width="14"/>
    <use href="#profile-head" transform="translate(184 186) rotate(-2)"/>

