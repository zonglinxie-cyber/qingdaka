<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">坐姿小幅开胸：肩轻向后下，胸口微微打开</title>
  <desc id="desc">原创正视两格身体示意。第一格双脚平放、坐稳且上身自然立起。第二格双臂低低向侧展开，肩轻向后下，胸口稍向前上，不顶腰。舒适时停约五秒后放松，不保持整个回合。分步示意，非专业视频，不是解剖图。</desc>
  <rect width="720" height="480" rx="24" fill="#f6faf8"/>
  <g font-family="system-ui, sans-serif" fill="#1f3f46" text-anchor="middle">
    <text x="360" y="44" font-size="30" font-weight="700">坐姿小幅开胸</text>
    <rect x="24" y="66" width="324" height="338" rx="18" fill="#e7efec"/>
    <rect x="372" y="66" width="324" height="338" rx="18" fill="#e7efec"/>
    <text x="186" y="108" font-size="26">1 坐稳，自然立起</text>
    <text x="534" y="108" font-size="26">2 肩轻向后下</text>
    <text x="186" y="380" font-size="24">双脚平放，不坐椅沿</text>
    <text x="534" y="380" font-size="24">胸口微开，不顶腰</text>
    <text x="360" y="440" font-size="25">分步示意 · 非专业视频</text>
    <text x="360" y="470" font-size="22">舒适时停约 5 秒，再自然放松</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M68 336H310 M416 336H658" stroke="#91a5a0" stroke-width="4"/>
    <path d="M136 225V276H236V225 M142 276V332 M230 276V332 M484 225V276H584V225 M490 276V332 M578 276V332" stroke="#647e79" stroke-width="8"/>
    <circle cx="186" cy="165" r="23" fill="#f6faf8" stroke="#1f3f46" stroke-width="8"/>
    <path d="M186 192V264 M162 209H210 M162 209L154 239L158 262 M210 209L218 239L214 262 M186 264L163 283V328H146 M186 264L209 283V328H226" stroke="#1f3f46" stroke-width="13"/>
    <circle cx="534" cy="165" r="23" fill="#f6faf8" stroke="#1f3f46" stroke-width="8"/>
    <path d="M534 192V264 M534 264L511 283V328H494 M534 264L557 283V328H574" stroke="#1f3f46" stroke-width="13"/>
    <path d="M508 213Q534 204 560 213 M508 213L484 235L461 248 M560 213L584 235L607 248" stroke="#147a68" stroke-width="12"/>
