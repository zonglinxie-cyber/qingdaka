<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">室内慢走：向前迈小步，没路就停</title>
  <desc id="desc">原创侧视两格身体示意。第一格在平整、防滑、无障碍的短直路上站稳。第二格向前迈出小步，手臂自然放松，不刻意抬膝、不跑跳。只在走路无痛且稳定时进行。到末端停稳，空间不够就结束回合，不拧脚急转。分步示意，非专业视频。</desc>
  <rect width="720" height="480" rx="24" fill="#f6faf8"/>
  <g font-family="system-ui, sans-serif" fill="#1f3f46" text-anchor="middle">
    <text x="360" y="44" font-size="30" font-weight="700">室内慢走</text>
    <rect x="24" y="66" width="324" height="338" rx="18" fill="#e7efec"/>
    <rect x="372" y="66" width="324" height="338" rx="18" fill="#e7efec"/>
    <text x="186" y="108" font-size="26">1 看清前方短路线</text>
    <text x="534" y="108" font-size="26">2 向前迈小步</text>
    <text x="186" y="380" font-size="24">走路无痛且稳定才做</text>
    <text x="534" y="380" font-size="24">没路就停，不急转</text>
    <text x="360" y="440" font-size="25">分步示意 · 非专业视频</text>
    <text x="360" y="470" font-size="22">慢走，不追步数；不边走边看屏幕</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
