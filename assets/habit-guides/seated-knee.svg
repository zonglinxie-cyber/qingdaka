<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">坐姿轻抬膝：脚稍离地，落稳后换脚</title>
  <desc id="desc">原创侧视两格身体示意。第一格坐稳，手轻扶座面两侧，双脚平放。第二格上身保持自然直立，前景一腿膝仍弯曲，只抬到脚稍离地，背景另一脚保持落地。慢慢放回并落稳后才换脚。不要求抬高。分步示意，非专业视频。</desc>
  <rect width="720" height="480" rx="24" fill="#f6faf8"/>
  <g font-family="system-ui, sans-serif" fill="#1f3f46" text-anchor="middle">
    <text x="360" y="44" font-size="30" font-weight="700">坐姿轻抬膝</text>
    <rect x="24" y="66" width="324" height="338" rx="18" fill="#e7efec"/>
    <rect x="372" y="66" width="324" height="338" rx="18" fill="#e7efec"/>
    <text x="186" y="108" font-size="26">1 坐稳，轻扶座面</text>
    <text x="534" y="108" font-size="26">2 一脚稍离地</text>
    <text x="186" y="380" font-size="24">双脚平放，不后仰</text>
    <text x="534" y="380" font-size="24">慢慢放回，落稳再换脚</text>
    <text x="360" y="440" font-size="25">分步示意 · 非专业视频</text>
    <text x="360" y="470" font-size="22">不追高度或次数；疼痛就停</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M68 340H310 M416 340H658" stroke="#91a5a0" stroke-width="4"/>
    <path d="M112 212V276H250 M122 276V336 M238 276V336 M460 212V276H598 M470 276V336 M586 276V336" stroke="#647e79" stroke-width="8"/>
