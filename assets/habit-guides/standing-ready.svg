<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">站姿准备：路线清空，无痛站稳</title>
  <desc id="desc">原创正视两格身体示意。第一格展示清空地面的站立位置及旁边的牢固台面；第二格双脚自然分开、手臂下垂站稳。只有站立和走路无痛且稳定才开始，不要求靠扶物硬撑。分步示意，非专业视频。</desc>
  <rect width="720" height="480" rx="24" fill="#f6faf8"/>
  <g font-family="system-ui, sans-serif" fill="#1f3f46" text-anchor="middle">
    <text x="360" y="44" font-size="30" font-weight="700">站稳再开始</text>
    <rect x="24" y="66" width="324" height="338" rx="18" fill="#e7efec"/>
    <rect x="372" y="66" width="324" height="338" rx="18" fill="#e7efec"/>
    <text x="186" y="108" font-size="26">1 清理平整短路线</text>
    <text x="534" y="108" font-size="26">2 无痛且稳定</text>
    <text x="186" y="380" font-size="24">地面防滑，台面牢固</text>
    <text x="534" y="380" font-size="24">疼痛或不稳就不做</text>
    <text x="360" y="440" font-size="25">分步示意 · 非专业视频</text>
    <text x="360" y="470" font-size="22">先看懂动作，不边走边看屏幕</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56 336H320 M404 336H668" stroke="#91a5a0" stroke-width="4"/>
    <path d="M65 234H124 M72 234V332 M116 234V332 M413 234H472 M420 234V332 M464 234V332" stroke="#647e79" stroke-width="9"/>
    <circle cx="213" cy="163" r="22" fill="#f6faf8" stroke="#1f3f46" stroke-width="8"/>
    <path d="M213 190V260 M190 207H236 M190 207L181 250 M236 207L245 250 M213 260L192 328H177 M213 260L234 328H249" stroke="#1f3f46" stroke-width="13"/>
    <circle cx="561" cy="163" r="22" fill="#f6faf8" stroke="#1f3f46" stroke-width="8"/>
    <path d="M561 190V260 M538 207H584 M538 207L529 250 M584 207L593 250 M561 260L540 328H525 M561 260L582 328H597" stroke="#1f3f46" stroke-width="13"/>
    <path d="M280 167l11 11 19-24 M628 167l11 11 19-24" stroke="#147a68" stroke-width="6"/>
  </g>
</svg>
